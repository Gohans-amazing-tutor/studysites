<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sites</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="content-container"></div>

    <script>
        async function loadSites() {
            try {
                const response = await fetch('site.json');
                if (!response.ok) {
                    throw new Error('Failed to load site.json');
                }
                const data = await response.json();
                displaySites(data.sections);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displaySites(sections) {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            sections.forEach(section => {
                section.links.forEach(link => {
                    const button = document.createElement('button');
                    button.textContent = link.name;
                    button.onclick = () => {
                        const blankWindow = window.open('about:blank', '_blank');
                        if (blankWindow) {
                            blankWindow.location.href = link.url;
                        }
                    };
                    container.appendChild(button);
                });
            });
        }

        document.addEventListener('DOMContentLoaded', loadSites);
    </script>
</body>
</html>
