<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background-color: #f8f9fa;
            color: #202122;
            line-height: 1.6;
        }

        .mw-page-container {
            max-width: 960px;
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }

        .mw-page-title-main {
            padding: 20px;
            font-size: 1.8em;
            line-height: 1.3;
            border-bottom: 1px solid #a2a9b1;
            font-weight: bold;
        }

        .toc {
            background-color: #f8f9fa;
            border: 1px solid #a2a9b1;
            padding: 12px 16px;
            margin: 20px;
            float: right;
            clear: right;
            width: 280px;
            font-size: 0.9em;
        }

        .toc-title {
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .toc ul {
            list-style: none;
            padding-left: 0;
        }

        .toc li {
            margin-bottom: 5px;
            padding-left: 15px;
        }

        .toc a {
            color: #0645ad;
            text-decoration: none;
            cursor: pointer;
        }

        .toc a:hover {
            text-decoration: underline;
        }

        .mw-content {
            padding: 20px;
        }

        .mw-section {
            margin: 20px 0;
            clear: both;
        }

        .mw-section h2 {
            font-size: 1.5em;
            font-weight: bold;
            border-bottom: 1px solid #a2a9b1;
            padding: 10px 0;
            margin-bottom: 15px;
        }

        .link-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 15px;
        }

        .link-button {
            background-color: #eaecf0;
            border: 1px solid #a2a9b1;
            padding: 15px;
            cursor: pointer;
            font-family: Georgia, serif;
            font-size: 1em;
            text-align: center;
            transition: background-color 0.2s;
            color: #0645ad;
            text-decoration: none;
            display: block;
        }

        .link-button:hover {
            background-color: #d6d6d6;
        }

        .link-button:active {
            background-color: #b2b2b2;
        }

        @media (max-width: 768px) {
            .toc {
                width: 100%;
                float: none;
                margin: 20px 0;
            }

            .link-section {
                grid-template-columns: 1fr;
            }

            .mw-page-title-main {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="mw-page-container">
        <h1 class="mw-page-title-main">Study Sites</h1>

        <div class="mw-content">
            <div class="toc">
                <div class="toc-title">Contents</div>
                <ul id="toc-list"></ul>
            </div>

            <div id="content-container"></div>
        </div>
    </div>

    <script>
        async function loadSites() {
            try {
                const response = await fetch('site.json');
                if (!response.ok) {
                    throw new Error('Failed to load site.json');
                }
                const data = await response.json();
                displaySites(data.sections);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displaySites(sections) {
            const container = document.getElementById('content-container');
            const tocList = document.getElementById('toc-list');
            
            container.innerHTML = '';
            tocList.innerHTML = '';

            sections.forEach((section, index) => {
                // Add to table of contents
                const tocItem = document.createElement('li');
                const tocLink = document.createElement('a');
                tocLink.textContent = section.title;
                tocLink.onclick = () => {
                    document.getElementById(`section-${index}`).scrollIntoView({ behavior: 'smooth' });
                };
                tocItem.appendChild(tocLink);
                tocList.appendChild(tocItem);

                // Create section
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'mw-section';
                sectionDiv.id = `section-${index}`;

                const title = document.createElement('h2');
                title.textContent = section.title;
                sectionDiv.appendChild(title);

                const linkSection = document.createElement('div');
                linkSection.className = 'link-section';

                section.links.forEach(link => {
                    const button = document.createElement('button');
                    button.className = 'link-button';
                    button.textContent = link.name;
                    button.onclick = () => {
                        const blankWindow = window.open('about:blank', '_blank');
                        if (blankWindow) {
                            blankWindow.location.href = link.url;
                        }
                    };
                    linkSection.appendChild(button);
                });

                sectionDiv.appendChild(linkSection);
                container.appendChild(sectionDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', loadSites);
    </script>
</body>
</html>
