<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .sections-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
        }

        .section h2 {
            background-color: #333;
            color: white;
            padding: 10px;
            margin: -20px -20px 15px -20px;
            font-size: 18px;
        }

        .link-button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
        }

        .link-button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 900px) {
            .sections-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .sections-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Study Sites</h1>
    <div class="sections-container" id="sections-container"></div>

    <script>
        async function loadSites() {
            try {
                const response = await fetch('site.json');
                if (!response.ok) {
                    throw new Error('Failed to load site.json');
                }
                const data = await response.json();
                displaySites(data.sections);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function displaySites(sections) {
            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            sections.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';

                const title = document.createElement('h2');
                title.textContent = section.title;
                sectionDiv.appendChild(title);

                section.links.forEach(link => {
                    const button = document.createElement('button');
                    button.className = 'link-button';
                    button.textContent = link.name;
                    button.onclick = () => {
                        const blankWindow = window.open('about:blank', '_blank');
                        if (blankWindow) {
                            blankWindow.location.href = link.url;
                        }
                    };
                    sectionDiv.appendChild(button);
                });

                container.appendChild(sectionDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', loadSites);
    </script>
</body>
</html>
