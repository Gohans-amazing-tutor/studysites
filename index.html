<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudySites — curated links</title>
  <style>
    :root{
      --bg:#0f1724; /* deep navy */
      --card:#0b1220;
      --muted:#9aa4b2;
      --accent:#56b6f8;
      --glass: rgba(255,255,255,0.04);
      --radius:12px;
      --max-width:1100px;
      --ff: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    /* Reset / layout */
    html,body{height:100%;margin:0;font-family:var(--ff);background:linear-gradient(180deg,#071025 0%, #081327 60%);color:#e6eef8}
    a{color:inherit}
    .container{max-width:var(--max-width);margin:32px auto;padding:28px}

    /* Header */
    header{display:flex;align-items:center;gap:16px}
    .logo{width:56px;height:56px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#9b79ff);box-shadow:0 6px 18px rgba(13,23,42,0.6);flex-shrink:0}
    .logo svg{width:34px;height:34px}
    h1{margin:0;font-size:1.45rem;letter-spacing:0.2px}
    .subtitle{margin-top:6px;color:var(--muted);font-size:0.95rem}

    /* Controls */
    .controls{display:flex;gap:12px;margin-top:18px;align-items:center}
    .search{flex:1;display:flex;align-items:center;background:var(--glass);border-radius:10px;padding:6px 10px;border:1px solid rgba(255,255,255,0.03)}
    .search input{flex:1;background:transparent;border:0;color:inherit;padding:8px;font-size:0.98rem;outline:none}
    .hint{color:var(--muted);font-size:0.9rem}

    /* List grid */
    .list{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:var(--radius);padding:14px;box-shadow:0 6px 20px rgba(3,6,23,0.6);border:1px solid rgba(255,255,255,0.03);display:flex;flex-direction:column;min-height:120px;transition:transform 180ms ease,box-shadow 180ms ease}
    .card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,0.6)}

    .card-top{display:flex;gap:12px;align-items:start}
    .favicon{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg, rgba(255,255,255,0.03), rgba(0,0,0,0.15));display:grid;place-items:center;font-weight:700;color:var(--accent);flex-shrink:0}
    .title{font-size:1rem;margin:0}
    .desc{color:var(--muted);font-size:0.92rem;margin-top:6px;flex:1}

    .meta{margin-top:10px;color:var(--muted);font-size:0.82rem}

    .actions{margin-top:12px;display:flex;gap:8px}
    button.primary{background:linear-gradient(90deg,var(--accent),#8dd3ff);border:none;color:#062231;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700}
    a.secondary{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);display:inline-flex;align-items:center;gap:8px}

    /* Empty / error */
    .empty{grid-column:1/-1;padding:18px;border-radius:12px;background:rgba(255,255,255,0.02);color:var(--muted);border:1px dashed rgba(255,255,255,0.03)}

    /* Footer */
    .footer{margin-top:28px;color:var(--muted);font-size:0.9rem;display:flex;gap:10px;flex-wrap:wrap}

    /* Responsive tweaks */
    @media (max-width:640px){
      .container{padding:18px;margin:18px}
      header{gap:12px}
      h1{font-size:1.2rem}
      .controls{flex-direction:column;align-items:stretch}
      .list{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
    }

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo" aria-hidden>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <rect x="3" y="3" width="18" height="18" rx="4" fill="white" opacity="0.06"/>
          <path d="M7 9h10M7 13h6" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
        </svg>
      </div>
      <div>
        <h1>StudySites</h1>
        <div class="subtitle">A curated collection of helpful study links — quick to browse and friendly to use.</div>
        <div class="controls">
          <div class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="opacity:0.85;margin-right:8px" xmlns="http://www.w3.org/2000/svg"><path d="M21 21l-4.35-4.35" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"></path><circle cx="11" cy="11" r="6" stroke="white" stroke-width="1.6" opacity="0.7"></circle></svg>
            <input id="filter" placeholder="Search links (title, description)" aria-label="Search links">
          </div>
          <div class="hint">Tip: Use "Preview" to open a safe preview (some sites block embedding).</div>
        </div>
      </div>
    </header>

    <div class="list" id="list"><div class="empty">Loading...</div></div>

    <div class="footer">
      <div><strong>Repository files</strong>:</div>
      <div><a class="secondary" href="https://raw.githubusercontent.com/Gohans-amazing-tutor/studysites/main/34.cpp" target="_blank">34.cpp</a></div>
      <div><a class="secondary" href="https://raw.githubusercontent.com/Gohans-amazing-tutor/studysites/main/computer.cs" target="_blank">computer.cs</a></div>
      <div><a class="secondary" href="https://raw.githubusercontent.com/Gohans-amazing-tutor/studysites/main/site.json" target="_blank">site.json</a></div>
    </div>
  </div>

  <script>
    // Small helper: safely escape text for insertion into textContent (we're using textContent mostly so this is minimal)
    function escapeText(s){return String(s == null ? '' : s)}

    // Filter functionality
    const filterEl = document.getElementById('filter');
    filterEl?.addEventListener('input', () => { applyFilter(filterEl.value) });

    let rawSites = [];
    async function load(){
      const listEl = document.getElementById('list');
      try{
        const r = await fetch('site.json', {cache: 'no-cache'});
        if(!r.ok) throw new Error('Failed to load site.json: '+r.status);
        const data = await r.json();
        if(!Array.isArray(data.sites)) throw new Error('site.json must contain an array under "sites"');

        rawSites = data.sites.map(s => ({
          title: s.title || s.name || 'Untitled',
          description: s.description || '',
          url: s.url || s.link || '#'
        }));

        renderList(rawSites);

      }catch(err){
        listEl.innerHTML = '<div class="empty">Error: '+escapeText(err.message)+'</div>';
        console.error(err);
      }
    }

    function renderList(items){
      const listEl = document.getElementById('list');
      listEl.innerHTML = '';
      if(!items.length){ listEl.innerHTML = '<div class="empty">No links match your search.</div>'; return }

      items.forEach(site => {
        const card = document.createElement('div'); card.className='card';

        const top = document.createElement('div'); top.className='card-top';
        const fav = document.createElement('div'); fav.className='favicon'; fav.textContent = (site.title[0]||'S').toUpperCase();
        const txt = document.createElement('div'); txt.style.flex='1';
        const h = document.createElement('h3'); h.className='title'; h.textContent = site.title;
        const p = document.createElement('div'); p.className='desc'; p.textContent = site.description;
        txt.appendChild(h); txt.appendChild(p);
        top.appendChild(fav); top.appendChild(txt);

        const meta = document.createElement('div'); meta.className='meta'; meta.textContent = site.url;

        const actions = document.createElement('div'); actions.className='actions';
        const previewBtn = document.createElement('button'); previewBtn.className='primary'; previewBtn.textContent='Preview';
        previewBtn.addEventListener('click', ()=> openInAboutBlank(site.url, site.title));

        const openLink = document.createElement('a'); openLink.className='secondary'; openLink.textContent='Open'; openLink.href = site.url; openLink.target = '_blank';
        actions.appendChild(previewBtn); actions.appendChild(openLink);

        card.appendChild(top);
        card.appendChild(meta);
        card.appendChild(actions);

        listEl.appendChild(card);
      });
    }

    function applyFilter(q){
      const qn = String(q||'').trim().toLowerCase();
      if(!qn) return renderList(rawSites);
      const filtered = rawSites.filter(s => (s.title + ' ' + s.description + ' ' + s.url).toLowerCase().includes(qn));
      renderList(filtered);
    }

    function openInAboutBlank(url, title){
      // Keep existing safe preview behaviour but with clearer fallback.
      const win = window.open('about:blank', '_blank');
      if(!win){ alert('Popup blocked. Allow popups for this site.'); return }

      const safeTitle = (title || url).replace(/[<>\"']/g,'');
      const safeUrl = url;

      const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${safeTitle}</title>
        <style>html,body{height:100%;margin:0;background:#071022;color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial}header{padding:10px 14px;background:linear-gradient(90deg,rgba(255,255,255,0.02),rgba(0,0,0,0.2));display:flex;align-items:center;gap:12px}header .title{font-weight:700}iframe{border:0;width:100%;height:calc(100vh - 52px);display:block}</style>
        </head><body><header><div class="title">Preview: ${safeTitle}</div><div style="margin-left:auto"><a href="${safeUrl}" target="_blank" style="color:#9bdcff;text-decoration:none">Open in new tab</a></div></header><iframe src="${safeUrl}" sandbox="allow-forms allow-scripts allow-same-origin allow-popups" ></iframe></body></html>`;

      try{ win.document.open(); win.document.write(html); win.document.close(); }
      catch(e){
        // Writing may fail in some browsers; fallback to direct navigation
        console.warn('Preview write failed, navigating directly', e);
        try{ win.location = url } catch(e2){ alert('Unable to open preview. ' + e2.message) }
      }
    }

    // Initialize
    load();
  </script>
</body>
</html>
