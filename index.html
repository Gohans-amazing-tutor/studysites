<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Sites</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .link-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
        }

        .link-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .link-button:active {
            transform: translateY(0);
        }

        .error {
            color: #e74c3c;
            text-align: center;
            padding: 20px;
            background: #fadbd8;
            border-radius: 8px;
            margin: 20px 0;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Study Sites</h1>
        <div id="links-container" class="loading">Loading sites...</div>
    </div>

    <script>
        // Fetch and load sites from JSON
        async function loadSites() {
            try {
                const response = await fetch('site.json');
                if (!response.ok) {
                    throw new Error('Failed to load site.json');
                }
                const data = await response.json();
                displaySites(data.sites);
            } catch (error) {
                const container = document.getElementById('links-container');
                container.innerHTML = `<div class="error">Error loading sites: ${error.message}</div>`;
                console.error('Error:', error);
            }
        }

        // Display sites as clickable buttons
        function displaySites(sites) {
            const container = document.getElementById('links-container');
            container.innerHTML = '';

            if (!sites || sites.length === 0) {
                container.innerHTML = '<div class="error">No sites found in site.json</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'links-grid';

            sites.forEach(site => {
                const button = document.createElement('button');
                button.className = 'link-button';
                button.textContent = site.name;
                button.onclick = () => {
                    // Open URL in about:blank window
                    const blankWindow = window.open('about:blank', '_blank');
                    if (blankWindow) {
                        blankWindow.location.href = site.url;
                    }
                };
                grid.appendChild(button);
            });

            container.appendChild(grid);
        }

        // Load sites when page loads
        document.addEventListener('DOMContentLoaded', loadSites);
    </script>
</body>
</html>
