<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StudySites Links</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0;padding:20px;background:#f7f9fb}
    .container{max-width:900px;margin:0 auto}
    header{display:flex;align-items:center;gap:12px}
    h1{margin:0;font-size:1.4rem}
    .list{margin-top:20px;display:grid;gap:12px}
    .card{background:#fff;border:1px solid #e3e7ee;padding:14px;border-radius:8px;box-shadow:0 1px 0 rgba(16,24,40,0.02)}
    .card h2{margin:0 0 6px;font-size:1.05rem}
    .card p{margin:0 0 10px;color:#333}
    .actions{display:flex;gap:8px}
    button,a.link{background:#0366d6;color:#fff;padding:8px 10px;border-radius:6px;text-decoration:none;border:none;cursor:pointer;font-weight:600}
    a.download{background:#eaeef6;color:#0366d6;padding:8px 10px;border-radius:6px;text-decoration:none;border:1px solid #dfe8f6}
    .meta{font-size:0.9rem;color:#666;margin-top:8px}
    .footer{margin-top:28px;color:#666}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="4" fill="#0366d6"/></svg>
      <div>
        <h1>StudySites — link list</h1>
        <div class="meta">Click a link to open it inside an about:blank window (the address bar will remain about:blank).</div>
      </div>
    </header>

    <div class="list" id="list">Loading...</div>

    <div class="footer">
      <strong>Repository files</strong>: <a class="download" href="https://raw.githubusercontent.com/Gohans-amazing-tutor/studysites/main/34.cpp" target="_blank">34.cpp</a>
      <a class="download" href="https://raw.githubusercontent.com/Gohans-amazing-tutor/studysites/main/computer.cs" target="_blank">computer.cs</a>
      <a class="download" href="https://raw.githubusercontent.com/Gohans-amazing-tutor/studysites/main/site.json" target="_blank">site.json</a>
    </div>
  </div>

  <script>
    // Utility to safely escape values used inside HTML attributes
    function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

    async function load() {
      const listEl = document.getElementById('list');
      try {
        const r = await fetch('site.json', {cache: 'no-cache'});
        if(!r.ok) throw new Error('Failed to load site.json: '+r.status);
        const data = await r.json();
        if(!Array.isArray(data.sites)) throw new Error('site.json must contain an array under "sites"');

        listEl.innerHTML = '';
        data.sites.forEach(site => {
          const card = document.createElement('div'); card.className = 'card';
          const title = document.createElement('h2'); title.textContent = site.title || site.name || 'Untitled';
          const p = document.createElement('p'); p.textContent = site.description || '';
          const actions = document.createElement('div'); actions.className='actions';

          const openBtn = document.createElement('button'); openBtn.className='link'; openBtn.textContent='Open';
          openBtn.addEventListener('click', ()=>openInAboutBlank(site.url, site.title));

          const newTab = document.createElement('a'); newTab.className='download'; newTab.textContent='Open raw'; newTab.href = site.url; newTab.target='_blank';

          actions.appendChild(openBtn);
          actions.appendChild(newTab);

          card.appendChild(title);
          card.appendChild(p);
          card.appendChild(actions);
          listEl.appendChild(card);
        });

      } catch (err) {
        listEl.innerHTML = '<div class="card"><strong>Error:</strong> '+escapeAttr(err.message)+'</div>';
        console.error(err);
      }
    }

    function openInAboutBlank(url, title){
      // Open an about:blank window and inject an iframe that loads the target URL.
      // The top-level address stays about:blank while the iframe contains the requested site.
      // Note: some sites block being embedded in iframes (X-Frame-Options/CSP). If a site refuses,
      // the iframe may show an error or remain blank.

      const win = window.open('about:blank', '_blank');
      if(!win) { alert('Popup blocked. Allow popups for this site.'); return; }

      const safeTitle = escapeAttr(title || url);
      const safeUrl = escapeAttr(url);

      const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${safeTitle}</title>
        <style>html,body{height:100%;margin:0}iframe{border:0;width:100%;height:100vh;display:block}</style>
        </head><body><iframe src="${safeUrl}" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-pointer-lock allow-popups-to-escape-sandbox"></iframe></body></html>`;

      // Write the document into the new window (replaces about:blank content). We use write+close to ensure it's ready.
      try{
        win.document.open();
        win.document.write(html);
        win.document.close();
      }catch(e){
        // Some browsers may restrict writing to the new window depending on cross-origin policies; try a simple fallback:
        win.location = 'about:blank';
        setTimeout(()=>{
          try{ win.document.open(); win.document.write(html); win.document.close(); }catch(e2){
            // If that fails, navigate the window directly to the url (this will reveal the URL).
            win.location = url;
          }
        }, 50);
      }
    }

    load();
  </script>
</body>
</html>
